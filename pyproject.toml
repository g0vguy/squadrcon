[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "squadrcon"
version = "0.1.0"
description = "RCON client and CLI for Squad game servers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "your name here" }
]
keywords = ["squad", "rcon", "game-server", "admin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Networking",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/yourname/squadrcon"
Issues = "https://github.com/yourname/squadrcon/issues"

[project.scripts]
squadrcon = "squadrcon.cli:main"

[tool.setuptools.packages.find]
include = ["squadrcon*"]

[tool.setuptools.package-data]
squadrcon = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
